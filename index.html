<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securiti.ai EMEA Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; margin: 0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className="w-5 h-5"></i>;
        };

        const App = () => {
            const [page, setPage] = useState('Dashboard');

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 glass border-r border-white/10 p-6 flex flex-col">
                        <div className="flex items-center gap-3 mb-10">
                            <div className="w-8 h-8 bg-cyan-500 rounded flex items-center justify-center">
                                <Icon name="shield" />
                            </div>
                            <span className="font-black tracking-tighter text-lg">SECURITI.AI</span>
                        </div>
                        
                        <nav className="flex-1 space-y-2">
                            {['Dashboard', 'Lead Qualification', 'ROI Studio'].map(item => (
                                <button 
                                    key={item}
                                    onClick={() => setPage(item)}
                                    className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all ${page === item ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-400/30' : 'text-slate-400 hover:bg-white/5'}`}
                                >
                                    <Icon name={item === 'Dashboard' ? 'layout' : item === 'ROI Studio' ? 'database' : 'user-plus'} />
                                    <span className="text-sm font-bold uppercase tracking-wider">{item}</span>
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content */}
                    <main className="flex-1 p-10 overflow-y-auto">
                        <header className="mb-10">
                            <h1 className="text-4xl font-black uppercase italic tracking-tight">{page}</h1>
                            <p className="text-slate-500 font-bold tracking-widest mt-1">EMEA SALES ENGINEERING COMMAND</p>
                        </header>

                        {page === 'Dashboard' && (
                            <div className="grid grid-cols-3 gap-6">
                                <div className="glass p-8 rounded-3xl border-t-4 border-cyan-500">
                                    <p className="text-slate-500 text-xs font-black uppercase mb-2">Active Pipeline</p>
                                    <p className="text-4xl font-black">€14.2M</p>
                                </div>
                                <div className="glass p-8 rounded-3xl border-t-4 border-purple-500">
                                    <p className="text-slate-500 text-xs font-black uppercase mb-2">Technical Win Rate</p>
                                    <p className="text-4xl font-black">84%</p>
                                </div>
                                <div className="glass p-8 rounded-3xl border-t-4 border-emerald-500">
                                    <p className="text-slate-500 text-xs font-black uppercase mb-2">Open PoCs</p>
                                    <p className="text-4xl font-black">32</p>
                                </div>
                            </div>
                        )}

                        {page === 'Lead Qualification' && (
                            <div className="max-w-xl glass p-10 rounded-3xl">
                                <p className="mb-6 text-slate-400">Fill in the discovery details to qualify the opportunity.</p>
                                <input className="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-4" placeholder="Customer Name" />
                                <select className="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-4 text-slate-400">
                                    <option>EMEA North</option>
                                    <option>EMEA Central</option>
                                    <option>EMEA South</option>
                                </select>
                                <button className="w-full bg-cyan-500 text-[#020617] font-black py-4 rounded-xl uppercase tracking-widest">Submit to Team</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
